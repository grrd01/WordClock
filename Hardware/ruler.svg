<?xml version="1.0" encoding="UTF-8"?>
<svg width="104mm" height="15mm" viewBox="-2 -1 104 14"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .mm  { stroke:black; stroke-width:0.3; }
    .hcm { stroke:black; stroke-width:0.35; }
    .cm  { stroke:black; stroke-width:0.4; }
    text { font-family: Arial, Helvetica, sans-serif;
           font-size:4px;
           fill:black; }
  </style>

  <!-- Grundlinie -->
  <line x1="0" y1="0.2" x2="100" y2="0.2" class="cm"/>

  <!-- Millimeter-Markierungen -->
  <!-- automatisch statisch erzeugtes Muster -->

  <!-- 0–100 mm -->
  <!-- cm = 8mm hoch -->
  <!-- 5mm = 6mm hoch -->
  <!-- 1mm = 4mm hoch -->

  <!-- mm-Striche -->
  <!-- Generiert -->

  <!-- START -->
  <!-- wir nutzen ein Pattern über <g> mit transform -->

  <!-- Einzeldefinition eines 1mm-Strichs -->
  <defs>
    <line id="tick1" x1="0" y1="0" x2="0" y2="4" class="mm"/>
    <line id="tick5" x1="0" y1="0" x2="0" y2="6" class="hcm"/>
    <line id="tick10" x1="0" y1="0" x2="0" y2="8" class="cm"/>
  </defs>

  <!-- Platzieren aller Striche -->
  <g>
    <!-- 0–100 mm -->
    <!-- per 1mm Raster -->
    
    <!-- Manuell korrekt aufgebaut -->
    <!-- 0 -->
    <use href="#tick10" x="0"/>
    <!-- 1–4 -->
    <use href="#tick1" x="1"/>
    <use href="#tick1" x="2"/>
    <use href="#tick1" x="3"/>
    <use href="#tick1" x="4"/>
    <!-- 5 -->
    <use href="#tick5" x="5"/>
    <!-- 6–9 -->
    <use href="#tick1" x="6"/>
    <use href="#tick1" x="7"/>
    <use href="#tick1" x="8"/>
    <use href="#tick1" x="9"/>
    <!-- 10 -->
    <use href="#tick10" x="10"/>

    <!-- Wiederholung pro cm -->
    <!-- Wir wiederholen das 10er-Muster verschoben -->

    <!-- 10–100 -->
    <g>
      <!-- erzeugt restliche cm-Blöcke -->
      <!-- 1 bis 9 cm -->
      <!-- systematisch -->
      
      <!-- cm 1–9 -->
      <!-- automatisiert ausgeschrieben -->

      <!-- Block 1 -->
      <g transform="translate(10,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

      <g transform="translate(20,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

      <g transform="translate(30,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

      <g transform="translate(40,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

      <g transform="translate(50,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

      <g transform="translate(60,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

      <g transform="translate(70,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

      <g transform="translate(80,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

      <g transform="translate(90,0)">
        <use href="#tick10" x="0"/>
        <use href="#tick1" x="1"/>
        <use href="#tick1" x="2"/>
        <use href="#tick1" x="3"/>
        <use href="#tick1" x="4"/>
        <use href="#tick5" x="5"/>
        <use href="#tick1" x="6"/>
        <use href="#tick1" x="7"/>
        <use href="#tick1" x="8"/>
        <use href="#tick1" x="9"/>
      </g>

    </g>

    <!-- letzter 100mm Strich -->
    <use href="#tick10" x="100"/>
  </g>

  <!-- Zentimeter-Beschriftung -->
  <g text-anchor="middle">
    <text x="0" y="12">0</text>
    <text x="10" y="12">1</text>
    <text x="20" y="12">2</text>
    <text x="30" y="12">3</text>
    <text x="40" y="12">4</text>
    <text x="50" y="12">5</text>
    <text x="60" y="12">6</text>
    <text x="70" y="12">7</text>
    <text x="80" y="12">8</text>
    <text x="90" y="12">9</text>
    <text x="100" y="12">10</text>
  </g>

</svg>